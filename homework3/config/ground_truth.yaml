# HW3 ground truth -- tape-measured. USED ONLY BY THE EVALUATION SCRIPT.
# The SLAM node never reads this file: the filter starts with no landmarks.
#
# World frame: origin = one corner of the field (floor tape mark). The tags with
# x = 0 (1, 2) are on one wall and those with y = 0 (8, 9) on the adjacent wall.
# The frame must be right-handed: standing at the origin and looking along +x,
# +y must point to your LEFT (CCW angles positive).
# Units: meters and degrees. Positions are tag CENTERS (black square center).

field_side_m: 2.44          # 8 ft = 2.438 m (handout minimum)
diagonals_m: [null, null]   # both diagonals, as a squareness check (ideal 3.451 m)

tags:                       # id: {x, y, wall}; at 1/3 and 2/3 of each wall
  1: {x: 0.000, y: 0.820, wall: x=0}
  2: {x: 0.000, y: 1.640, wall: x=0}
  3: {x: 0.820, y: 2.440, wall: y=2.44}
  4: {x: 1.640, y: 2.440, wall: y=2.44}
  5: {x: 2.440, y: 1.640, wall: x=2.44}
  7: {x: 2.440, y: 0.820, wall: x=2.44}
  8: {x: 1.640, y: 0.000, wall: y=0}
  9: {x: 0.820, y: 0.000, wall: y=0}

# Robot reference point (ground point 9 cm behind the camera lens) and heading
# at the start of each run. yaw_deg: 0 = facing +x, CCW positive.
# Planned (centered paths, facing +x): square n=1.2 -> (0.620, 0.620, 0);
# octagon m=0.5 -> (0.970, 0.616, 0). Replace with what you actually measure.
start_poses:
  square:  {x: null, y: null, yaw_deg: null}
  octagon: {x: null, y: null, yaw_deg: null}

measured_by: null
date: null
notes: null
